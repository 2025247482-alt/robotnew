
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Blender Robot AR</title>

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

    <!-- AR.js -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        #info {
            position: fixed;
            top: 10px;
            left: 0;
            right: 0;
            z-index: 10;
            text-align: center;
            color: white;
            pointer-events: none;
        }

        #info h2 {
            margin: 0;
            font-size: 20px;
            text-shadow: 1px 1px 4px black;
        }

        #status {
            display: inline-block;
            margin-top: 8px;
            padding: 6px 12px;
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.65);
            font-size: 14px;
        }

        #help {
            position: fixed;
            bottom: 12px;
            left: 10px;
            right: 10px;
            z-index: 10;
            text-align: center;
            color: white;
            font-size: 13px;
            text-shadow: 1px 1px 3px black;
            pointer-events: none;
        }
    </style>
</head>

<body>

    <div id="info">
        <h2>My Blender Robot AR</h2>
        <div id="status">Allow camera access and scan the Hiro marker</div>
    </div>

    <div id="help">
        Keep the complete Hiro marker visible, well lit, and steady.
    </div>

    <a-scene
        embedded
        vr-mode-ui="enabled: false"
        loading-screen="enabled: false"
        renderer="antialias: true; colorManagement: true;"
        arjs="sourceType: webcam;
              trackingMethod: best;
              detectionMode: mono;
              matrixCodeType: 3x3;
              debugUIEnabled: false;">

        <!-- Hiro marker -->
        <a-marker
            id="hiroMarker"
            preset="hiro"
            smooth="true"
            smoothCount="5"
            smoothTolerance="0.01"
            smoothThreshold="2">

            <!-- Blender model -->
            <a-entity
                id="robotModel"
                gltf-model="./robot.glb"
                position="0 0 0"
                rotation="0 0 0"
                scale="0.2 0.2 0.2"
                visible="true">
            </a-entity>

        </a-marker>

        <!-- AR camera -->
        <a-entity camera></a-entity>

    </a-scene>

    <script>
        const marker = document.getElementById("hiroMarker");
        const robot = document.getElementById("robotModel");
        const status = document.getElementById("status");

        let modelLoaded = false;

        // Model loading status
        robot.addEventListener("model-loaded", function () {
            modelLoaded = true;
            status.textContent =
                "Robot loaded! Point your camera at the Hiro marker.";
        });

        robot.addEventListener("model-error", function (event) {
            status.textContent =
                "Could not load robot.glb. Check the filename and GitHub folder.";
            console.error("Robot model loading error:", event);
        });

        // Marker tracking status
        marker.addEventListener("markerFound", function () {
            if (modelLoaded) {
                status.textContent = "Hiro marker detected!";
            } else {
                status.textContent = "Marker detected. Loading robot...";
            }
        });

        marker.addEventListener("markerLost", function () {
            status.textContent =
                "Marker lost. Move the Hiro marker back into view.";
        });
    </script>

</body>
</html>
